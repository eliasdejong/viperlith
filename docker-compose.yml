services:
  app:
    build: .
    restart: always
    volumes:
      - app_data:/var/lib/viperlith
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SESSION_KEY
      - DB_PATH
      - DB_FILE
      - DB_ANALYZE_INTERVAL_HOURS
      - SHM_PATH_PREFIX
      - FRAME_RATE

volumes:
  app_data: