<div
	id="info-dialog"
	data-show="$_infoDialogOpen"
	style="display: none"
	class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2
			p-4 min-w-96 max-h-[80vh]
			flex flex-col
			shadow-2xl shadow-black/50 rounded-md
			bg-slate-200 dark:text-white dark:bg-slate-600"
>
	<div class="flex flex-row pb-4 items-center justify-between border-b border-slate-800">
		<h2 class="text-lg">Open channel</h2>
		<button
			data-on:click="$_infoDialogOpen = false"
			class="p-2 rounded-md text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors duration-200 hover:cursor-pointer">
			<!-- Exit icon -->
			<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mx-auto" viewBox="0 0 20 20" fill="currentColor">
				<path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd">
			</svg>
		</button>
	</div>

	<div class="flex flex-col gap-2 p-4 overflow-y-auto">
		<p>Allowed characters:</p>
		<ol class="pl-4">
			<li>1. alphanumeric characters (a-Z, 0-9)</li>
			<li>2. hyphens</li>
			<li>3. underscores</li>
		</ol>
		<p>May not start with a number or hyphen</p>
		<p>Max. 32 characters</p>
		<input
			data-bind:open-channel.name
			data-indicator:_fetching
			data-attr:disabled="$_fetching"
			type="text"
			minlength="1"
			maxlength="32"
			placeholder="Channel name"
			autocapitalize="off"
			autocomplete="off"
			autocorrect="off"
			spellcheck="false"
			class="p-2 bg-slate-500 rounded-md
					focus:outline-none focus:ring-2 focus:ring-cyan-100
					focus:border-transparent transition duration-150"
		>
	</div>

	<div class="flex flex-row pt-4 justify-evenly items-center gap-3 border-t border-slate-800">
		<button
			data-indicator:_fetching
			data-attr:disabled="$_fetching"
			data-on:click="
				@post('/chat/open-channel').then(() => (
					$openChannel.name = '',
					$_infoDialogOpen = false
				))"
			class="px-6 py-2 min-w-36
					text-white
					bg-slate-700 duration-150 hover:bg-slate-500 cursor-pointer
					outline-none select-none rounded-md"
		>
			Open
		</button>
		<button
			data-on:click="$openChannel.name = ''; $_infoDialogOpen = false;"
			class="px-6 py-2 min-w-36
					text-slate-800 duration-150 hover:bg-slate-400 cursor-pointer
					border outline-none select-none rounded-md"
		>
			Cancel
		</button>
	</div>
</div>
